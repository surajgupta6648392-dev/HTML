{% extends "base.html" %}
{% block title %}Edit Student · LibraryMS{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-person text-primary"></i> Edit Student</h2>
<div class="card"><div class="card-body">
  <form method="post">
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" value="{{ student.email }}" disabled></div>
    <div class="mb-3"><label class="form-label" for="name">Full name *</label>
      <input class="form-control" id="name" name="name" required value="{{ student.name }}"></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label" for="phone">Phone</label>
        <input class="form-control" id="phone" name="phone" value="{{ student.phone or '' }}"></div>
      <div class="col-md-6 mb-3"><label class="form-label" for="department">Department</label>
        <input class="form-control" id="department" name="department" value="{{ student.department or '' }}"></div>
    </div>
    <button class="btn btn-primary" type="submit"><i class="bi bi-check-circle"></i> Update</button>
    <a class="btn btn-secondary" href="{{ url_for('students') }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
