{% if r.status == 'issued' %}<span class="badge bg-info">Issued</span>
{% elif r.status == 'overdue' %}<span class="badge bg-danger">Overdue</span>
{% elif r.status == 'returned' %}<span class="badge bg-success">Returned</span>
{% else %}<span class="badge bg-secondary">{{ r.status }}</span>{% endif %}
