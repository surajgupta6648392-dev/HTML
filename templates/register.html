<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration · Library Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card auth-card shadow mt-5">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus display-4 text-primary"></i>
            <h4 class="mt-2">Student Registration</h4>
            <p class="text-muted">Create your library account</p>
          </div>
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
              {% endfor %}
            {% endif %}
          {% endwith %}
          <form method="post" action="{{ url_for('register') }}">
            <div class="mb-3">
              <label class="form-label" for="name">Full name</label>
              <input class="form-control" type="text" id="name" name="name" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Email address</label>
              <input class="form-control" type="email" id="email" name="email" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="phone">Phone</label>
                <input class="form-control" type="tel" id="phone" name="phone">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="department">Department</label>
                <input class="form-control" type="text" id="department" name="department" placeholder="e.g. Computer Science">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password <small class="text-muted">(min 6 characters)</small></label>
              <input class="form-control" type="password" id="password" name="password" minlength="6" required>
            </div>
            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-check-circle"></i> Register</button>
          </form>
          <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
